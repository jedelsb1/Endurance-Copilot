name: ADK CI/CD & Golden Dataset Evaluation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  agentops-evaluation:
    name: ADK Architecture Verification & Golden Dataset Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Zero Hardcoded API Keys
        run: |
          python -m pytest tests/test_adk_architecture_suite.py -k "test_adk_19_secure_secret_management" -v

      - name: Run Golden Dataset Automated Evaluation Suite (Criteria 1-19)
        env:
          EC_TESTING: "1"
        run: |
          python -m pytest tests/test_adk_architecture_suite.py tests/test_regression_suite.py -v
